name: CI
on:
  workflow_dispatch:
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3.22.3
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - uses: cachix/cachix-action@v15
        with:
          name: playwright
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: nix flake check
        run: nix flake check --no-write-lock-file
      - name: Smoke test playwright-cli
        run: nix run --no-write-lock-file .#playwright-cli -- --version
      - name: Smoke test playwright-mcp
        run: nix run --no-write-lock-file .#playwright-mcp -- --version
      - name: Smoke test playwright-node
        run: nix run --no-write-lock-file .#playwright-node -- --version
      - name: Smoke test playwright-dotnet
        run: nix run --no-write-lock-file .#playwright-dotnet -- --version
      - name: Smoke test playwright-python
        run: nix run --no-write-lock-file .#playwright-python -- --version
